name: Build Debug APK

# ──────────────────────────────────────────────────────────────────────────────
# REQUIRED SECRET
# Before this workflow can build, add GOOGLE_SERVICES_JSON to your repo:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name:  GOOGLE_SERVICES_JSON
#   Value: paste the full contents of your app/google-services.json file
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
  pull_request:
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Tell the Android Gradle Plugin where the SDK is
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Fail fast with a clear message if the secret is not configured
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set."
            echo "   Go to: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "   Name:  GOOGLE_SERVICES_JSON"
            echo "   Value: paste the full contents of your google-services.json"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "google-services.json written successfully"

      # The wrapper downloads Gradle 8.6 automatically from services.gradle.org
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          # Download from the Actions run page on GitHub
          name: BinaryPuzzle-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        if: success()
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
